<svg xmlns="http://www.w3.org/2000/svg" width="960" height="690" viewBox="0 0 960 690" role="img" aria-labelledby="title desc">
<title id="title">Move Bitwig pad layouts</title>
<desc id="desc">Session has seven track columns and a green scene column. Bottom buttons select and stop each track, then select Main and stop all. Drums use the left sixteen pads to play and the right sixteen pads for note expressions. In Note, the bottom row is a sixteen-step sequencer.</desc>
