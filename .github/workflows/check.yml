name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node --test tests/*.test.cjs
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: python3 scripts/build.py
