name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check controller and module
        run: node --test tests/*.test.cjs
      - name: Build matched release archives
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/build.py --tag "$RELEASE_TAG"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag --draft --title "Move Bitwig $RELEASE_TAG" \
            --notes-file docs/RELEASE.md \
            dist/move-bitwig-module.tar.gz \
            dist/move-bitwig-controller-scripts.zip
